# === Ритуальный костёр ===
# Сколько единиц топлива сжигается за один период (по умолчанию 1)
bonfire-fuel-per-tick: 1
# Период тика костра в тиках (20 тиков = 1 секунда; 100 = 5 сек)
bonfire-tick-period-ticks: 100
# Сколько топлива даёт каждый тип древесины:
bonfire-fuel-log: 20      # брёвна/стволы/гифы (*_LOG, *_STEM, *_WOOD, *_HYPHAE)
bonfire-fuel-plank: 5     # доски (*_PLANKS)
bonfire-fuel-stick: 1     # палки (STICK)
# Спавнить ли мобов от костра (охранники при горении, орда при угасании, Варден при просрочке grace)
bonfire-spawn-mobs: true

# Вирус Мяуканья: глобальный тумблер распространения и симптомов
meow-virus-enabled: true

