# ============================================
#   Smakenchant — конфигурация зачарований
# ============================================
#
#  Формат для ванильных зачарований (overrides):
#    <имя_зачарования>:
#      enabled: true/false           — разрешать ли повышение уровня выше ванильного на наковальне
#      vanilla-max: N                — стандартный максимальный уровень (для справки)
#      new-max: M                    — новый максимальный уровень (можно ставить > vanilla-max)
#      cost-per-extra-level: X       — сколько доп. уровней ОПЫТА стоит каждый уровень сверх ванильного
#
#  Все значения можно менять на лету командой /smakenchant reload.

# ==== Зачарование: Многоуровневый прыжок (двойной/тройной) ====
#  Накладывается только на ботинки, стол зачарований / наковальня.
#  level 1 = двойной прыжок, level 2 = тройной прыжок.
multi-jump:
  enabled: true
  # Шанс получить это зачарование на столе зачарований (0.0 — никогда, 1.0 — всегда)
  # Отдельно для каждого уровня:
  chance-level-1: 0.08    # ~8% шанс при зачаровании ботинок
  chance-level-2: 0.03    # ~3% шанс
  # Вес на столе зачарований (как редкость: обычный ~10, редкий ~5, очень редкий ~2)
  weight: 4
  # Звук при прыжке (через Registry с фоллбэком)
  sound: "ENTITY_BREEZE_JUMP"
  sound-volume: 0.6
  sound-pitch: 1.4
  # Отключить прыжок если надета элитра (иначе можно летать как в креативе)
  disable-when-wearing-elytra: true
  # Сила ПОДБРАСЫВАНИЯ ВВЕРХ при двойном/тройном прыжке (ванильный прыжок ~0.42)
  jump-power: 0.5
  # Дополнительный импульс ВПЕРЁД по направлению взгляда (0 = нет, как обычный прыжок;
  # 0.2 = лёгкий даш вперёд; 0.4+ = как ракета). 0 РЕКОМЕНДУЕТСЯ чтобы не тормозить бег!
  forward-boost: 0.0

# ==== Повышение максимального уровня ванильных зачарований ====
#  Зачарования которых нет в этом списке останутся со стандартным максимумом.
#  Повышение работает ТОЛЬКО на наковальне (две книги +1 уровня или книга+вещь),
#  на столе зачарований такие уровни НЕ выпадают.
overrides:

  protection:
    enabled: true
    vanilla-max: 4
    new-max: 6
    cost-per-extra-level: 5      # ур.5 = +5 опыта, ур.6 = +10 опыта сверх ванильной стоимости

